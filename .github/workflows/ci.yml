name: CI

# Perception builds inside an Osprey workspace [REPO-SPLIT]: ospreylang at the tag in scripts/osprey-version,
# with this repository laid over it at the same paths (scripts/workspace.sh). The compiler is built
# from that tag in the workspace, cached by ospreylang's own setup action. Three phases, each once:
# build, lint and check; the canary on Linux and macOS with line coverage, the synthesis proofs and the VST3
# worker; then the coverage gate.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          path: .split
          lfs: true
      - &workspace
        name: Lay the Osprey workspace
        run: bash .split/scripts/workspace.sh "$GITHUB_WORKSPACE"
      - &compiler
        name: Build the compiler at scripts/osprey-version
        uses: ./.github/actions/setup-osprey-compiler
      # Every program this repository tracks compiles, with no red ([CI-PROGRAMS-COMPILE]). The
      # workspace's index is narrowed to this repository's files, so only they are checked.
      - name: Every program compiles
        run: |
          git rm -r -q --cached .
          xargs -d "\n" git add -f -- < .split/paths
          make _check_programs
      # [CI-LINT] Every Perception project with warnings as errors, and every Osprey source formatted.
      - name: Lint Osprey
        run: make -f scripts/make/perception.mk perception-lint
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install deslop
        run: bash scripts/ci/install-deslop.sh "$RUNNER_TEMP/bin"
      # [CI-LINT] paths, shell, Python, C/C++, JavaScript and the duplication gate, at pinned tool versions.
      - name: Lint everything else
        run: .split/scripts/lint.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/studio/website/package-lock.json
      - name: Website build
        run: make -f scripts/make/perception.mk perception-website

  test:
    name: "Canary (${{ matrix.os }})"
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - *checkout
      - *workspace
      - *compiler
      # The renderer bounds every host command with `timeout` (README prerequisites); macOS ships none,
      # so only coreutils' gtimeout goes on the path under that name.
      - name: timeout on macOS
        if: runner.os == 'macOS'
        run: |
          command -v gtimeout >/dev/null || brew install coreutils
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$(command -v gtimeout)" "$RUNNER_TEMP/bin/timeout"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Canary (the checks ospreylang runs on every build), with line coverage
        run: make -f scripts/make/perception.mk canary OSPREY_PREBUILT=1 PERCEPTION_COVERAGE=target/coverage/${{ matrix.os }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: target/coverage/
          if-no-files-found: error

  # [SYNTH-DSP-PROOFS] The synthesis theorems and the production DSP proofs, checked by the Osprey
  # proof kernel built for gc, arc and wasm32. A cold run builds lean4export from source.
  proofs:
    name: "Synthesis proofs"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WASI_SDK_VERSION: "25"
    steps:
      - *checkout
      - *workspace
      - *compiler
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install wasm-ld and a WASI sysroot
        run: |
          set -euo pipefail
          sudo apt-get install -y lld
          curl -fsSL --retry 3 --retry-max-time 60 -o /tmp/wasi-sysroot.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sysroot-${WASI_SDK_VERSION}.0.tar.gz"
          sudo mkdir -p /opt/wasi-sdk/share/wasi-sysroot
          sudo tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt/wasi-sdk/share/wasi-sysroot --strip-components=1
          echo "OSPREY_WASI_SYSROOT=/opt/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"
      - name: Build the wasm runtime archive
        run: make _runtime_wasm
      - name: Install Lean (elan, the workspace's pinned toolchain)
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat src/toolchain/benchmarks/proof/tools/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore the Lean proof tools
        id: proof-tools
        uses: actions/cache/restore@v4
        with:
          path: src/toolchain/benchmarks/proof/tools/.lake
          key: proof-tools-${{ runner.os }}-${{ hashFiles('src/toolchain/benchmarks/proof/tools/lake-manifest.json', 'src/toolchain/benchmarks/proof/tools/lean-toolchain', 'src/toolchain/benchmarks/proof/tools/lakefile.toml') }}
      - name: Build lean4export
        run: cd src/toolchain/benchmarks/proof/tools && lake build lean4export
      - name: Save the Lean proof tools
        if: ${{ always() && steps.proof-tools.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: src/toolchain/benchmarks/proof/tools/.lake
          key: ${{ steps.proof-tools.outputs.cache-primary-key }}
      - name: Synthesis and production DSP proofs
        run: make -f scripts/make/perception.mk synth-proofs

  # [SYNTH-HOST-VST] Perception Modular against the pinned official SDK: the SDK validator, then the
  # worker's scan, stream, state and device-queue checks (macOS is the verified platform).
  vst:
    name: "VST3 worker (macOS)"
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *workspace
      - name: Build and test the worker
        run: make -f scripts/make/perception.mk synth-vst

  # Reads the reports the test jobs wrote; runs nothing.
  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: .split
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
          path: target/coverage
      - name: Merged coverage of this repository's files reaches scripts/coverage-thresholds.json
        run: node .split/scripts/coverage.mjs "$GITHUB_WORKSPACE" target/coverage/*.json

  # The one required check.
  ci:
    name: CI
    if: always()
    needs: [build, test, proofs, vst, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job
        run: test "${{ needs.build.result }}" = success && test "${{ needs.test.result }}" = success && test "${{ needs.proofs.result }}" = success && test "${{ needs.vst.result }}" = success && test "${{ needs.coverage.result }}" = success
