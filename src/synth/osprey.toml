[project]
name = "synth"
source_roots = ["src"]
default_namespace = "synth"

[package]
name = "@osprey/synth"
license = "MIT"
summary = "Pure oscillators, pitch, modulation and PCM rendering shared by musical apps"
keywords = []

[modules]
allow_wildcard_imports = false

# A package's exports are its public API: each is documented and shows an example [DOC-EXPORT-REQUIRED] [DOC-EXPORT-EXAMPLE-REQUIRED]
[lints]
undocumented-export = "deny"
unexampled-export = "deny"
